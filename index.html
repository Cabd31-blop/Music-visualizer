<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Visualizer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin: 25px 0;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
}

canvas {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 80vh;
}
</style>
</head>

<body>

<h1>🎵 Music Visualizer</h1>

<button id="start">🎤 Activer le micro</button>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const button = document.getElementById("start");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.78;
}

resize();

window.addEventListener("resize", resize);


button.addEventListener("click", async () => {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audioContext = new AudioContext();

        await audioContext.resume();

        const analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 4096;

        analyser.smoothingTimeConstant = 0.65;

        const microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        const data =
            new Uint8Array(analyser.frequencyBinCount);

        const sampleRate =
            audioContext.sampleRate;

        button.style.display = "none";


        // ============================
        // PARAMÈTRES
        // ============================

        const bars = 50;

        const minFreq = 60;
        const maxFreq = 16000;


        // ============================
        // CONVERSION FRÉQUENCE → FFT
        // ============================

        function frequencyToBin(freq) {

            return Math.round(
                freq *
                analyser.fftSize /
                sampleRate
            );

        }


        // ============================
        // ANIMATION
        // ============================

        function animate() {

            requestAnimationFrame(animate);

            analyser.getByteFrequencyData(data);


            // Fond
            ctx.fillStyle = "rgba(0,0,0,0.28)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const barWidth =
                canvas.width / bars;


            for (let i = 0; i < bars; i++) {


                // Fréquence de départ
                const freq1 =
                    minFreq *
                    Math.pow(
                        maxFreq / minFreq,
                        i / bars
                    );


                // Fréquence de fin
                const freq2 =
                    minFreq *
                    Math.pow(
                        maxFreq / minFreq,
                        (i + 1) / bars
                    );


                const bin1 =
                    frequencyToBin(freq1);

                const bin2 =
                    frequencyToBin(freq2);


                // Moyenne de la zone
                let total = 0;
                let count = 0;


                for (
                    let j = bin1;
                    j <= bin2 &&
                    j < data.length;
                    j++
                ) {

                    total += data[j];
                    count++;

                }


                let value =
                    count > 0
                    ? total / count
                    : 0;


                // Seuil de bruit
                if (value < 8) {
                    value = 0;
                }


                // Amplification
                let height =
                    value * 2.8;


                height =
                    Math.min(
                        height,
                        canvas.height * 0.9
                    );


                // ============================
                // COULEURS
                // ============================

                const hue =
                    i / (bars - 1) * 300;


                ctx.fillStyle =
                    `hsl(${hue},100%,55%)`;


                ctx.shadowBlur = 12;

                ctx.shadowColor =
                    `hsl(${hue},100%,50%)`;


                ctx.fillRect(
                    i * barWidth,
                    canvas.height - height,
                    barWidth - 2,
                    height
                );

            }


            ctx.shadowBlur = 0;

        }


        animate();


    } catch (error) {

        console.error(error);

        alert(
            "Impossible d'utiliser le microphone."
        );

    }

});

</script>

</body>
</html>
