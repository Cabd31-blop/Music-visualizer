<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Visualizer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin: 25px 0;
    font-size: 30px;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
}

canvas {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 80vh;
}
</style>
</head>

<body>

<h1>🎵 Music Visualizer</h1>

<button id="start">🎤 Activer le micro</button>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const button = document.getElementById("start");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.78;
}

resize();
window.addEventListener("resize", resize);


button.addEventListener("click", async () => {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audioContext = new AudioContext();

        await audioContext.resume();

        const analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.72;

        const microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        const data =
            new Uint8Array(analyser.frequencyBinCount);

        const sampleRate =
            audioContext.sampleRate;

        const bars = 50;

        const minFreq = 60;
        const maxFreq = 16000;

        // Niveau de référence de chaque barre
        const baseline =
            new Array(bars).fill(8);

        button.style.display = "none";


        function frequencyToBin(freq) {

            return Math.round(
                freq *
                analyser.fftSize /
                sampleRate
            );

        }


        function animate() {

            requestAnimationFrame(animate);

            analyser.getByteFrequencyData(data);

            // Fond avec légère traînée
            ctx.fillStyle = "rgba(0,0,0,0.22)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const width =
                canvas.width / bars;


            for (let i = 0; i < bars; i++) {

                // Échelle logarithmique
                const freq1 =
                    minFreq *
                    Math.pow(
                        maxFreq / minFreq,
                        i / bars
                    );

                const freq2 =
                    minFreq *
                    Math.pow(
                        maxFreq / minFreq,
                        (i + 1) / bars
                    );


                const bin1 =
                    frequencyToBin(freq1);

                const bin2 =
                    frequencyToBin(freq2);


                let total = 0;
                let count = 0;


                for (
                    let j = bin1;
                    j <= bin2 &&
                    j < data.length;
                    j++
                ) {

                    total += data[j];
                    count++;

                }


                let value =
                    count > 0
                    ? total / count
                    : 0;


                // =========================
                // NORMALISATION DYNAMIQUE
                // =========================

                if (value < 8) {
                    value = 0;
                }


                // La référence descend lentement
                // et monte rapidement.
                if (value > baseline[i]) {

                    baseline[i] =
                        baseline[i] * 0.92 +
                        value * 0.08;

                } else {

                    baseline[i] =
                        baseline[i] * 0.995 +
                        value * 0.005;

                }


                // Rapport entre le son actuel
                // et le niveau habituel.
                let normalized =
                    value /
                    Math.max(baseline[i], 8);


                normalized =
                    Math.max(
                        0,
                        normalized - 0.35
                    );


                // Compression pour éviter
                // qu'une seule fréquence domine.
                normalized =
                    Math.pow(normalized, 0.65);


                let height =
                    normalized *
                    canvas.height *
                    0.75;


                height =
                    Math.min(
                        height,
                        canvas.height * 0.9
                    );


                // =========================
                // COULEURS
                // =========================

                const hue =
                    i / (bars - 1) * 300;


                const color =
                    `hsl(${hue},100%,55%)`;


                // Glow
                ctx.shadowBlur =
                    normalized > 0.15 ? 18 : 0;

                ctx.shadowColor =
                    color;

                ctx.fillStyle =
                    color;


                // Barre
                ctx.fillRect(
                    i * width,
                    canvas.height - height,
                    width - 3,
                    height
                );


                // Petit point lumineux au sommet
                if (height > 8) {

                    ctx.beginPath();

                    ctx.arc(
                        i * width + width / 2,
                        canvas.height - height,
                        3,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }

            }


            ctx.shadowBlur = 0;

        }


        animate();


    } catch (error) {

        console.error(error);

        alert(
            "Impossible d'utiliser le microphone."
        );

    }

});

</script>

</body>
</html>
